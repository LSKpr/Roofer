services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roofer}
      POSTGRES_USER: ${POSTGRES_USER:-roofer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roofer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/local-osm-schema.sql:/docker-entrypoint-initdb.d/20-local-osm-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roofer}:${POSTGRES_PASSWORD:-roofer}@db:5432/${POSTGRES_DB:-roofer}
      CORS_ORIGINS: http://localhost:3000
      DEMO_FALLBACK_ENABLED: ${DEMO_FALLBACK_ENABLED:-true}
      BUILDING_PROVIDER: ${BUILDING_PROVIDER:-overpass}
      MAX_ANALYSIS_AREA_KM2: ${MAX_ANALYSIS_AREA_KM2:-25}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
