name: roofer-v3

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: roofer
      POSTGRES_USER: roofer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roofer}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roofer -d roofer']
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 512mb

volumes:
  pgdata:
